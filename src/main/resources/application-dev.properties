# Perfil de desarrollo local.
#
# Se activa con SPRING_PROFILES_ACTIVE=dev, y es el sitio donde viven los valores
# comodos-pero-peligrosos que antes estaban como default en application.properties.
#
# La idea es que el archivo base sea seguro por omision y que haya que pedir
# explicitamente lo contrario. Antes era al reves: el default borraba la base y
# publicaba Swagger, y produccion dependia de que alguien se acordara de fijar
# tres variables. Olvidarse era silencioso; ahora olvidarse es no tener este
# perfil activo, que es visible y no destruye nada.
#
# Arrancar en local:
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run

# El esquema se regenera en cada arranque a partir de las entidades. En local es
# lo que se quiere mientras no haya migraciones: un cambio en un @Entity se ve de
# inmediato sin escribir un ALTER TABLE a mano.
spring.jpa.hibernate.ddl-auto=create-drop

# Ver el SQL que Hibernate genera es media depuracion de JPA.
spring.jpa.show-sql=true

# La documentacion navegable en http://localhost:8080/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
